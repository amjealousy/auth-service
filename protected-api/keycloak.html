<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protected API Demo</title>
    <style>
        :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; background: #ede8dc; color: #17211b; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
        main { width: min(46rem, calc(100% - 2rem)); }
        h1 { font-size: clamp(2rem, 8vw, 4.5rem); line-height: .9; letter-spacing: -.08em; margin: 0 0 1.5rem; }
        p { line-height: 1.6; max-width: 38rem; }
        nav { display: flex; flex-wrap: wrap; gap: .65rem; margin: 1.5rem 0; }
        button, a { border: 2px solid #17211b; background: #f7b32b; color: inherit; padding: .7rem 1rem; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; box-shadow: 4px 4px 0 #17211b; }
        button:hover, a:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #17211b; }
        button.secondary { background: #fff; }
        pre { min-height: 9rem; overflow: auto; padding: 1rem; border: 2px solid #17211b; background: #17211b; color: #d9f99d; white-space: pre-wrap; }
        .eyebrow { text-transform: uppercase; letter-spacing: .16em; font-weight: 700; }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">Server-side OIDC / PKCE</div>
    <h1>Protected API</h1>
    <p>Keycloak tokens stay in this server's in-memory session. The browser receives only an HttpOnly session cookie.</p>
    <nav>
        <a id="login" href="/login">Sign in</a>
        <button id="session" class="secondary" type="button">Session</button>
        <button id="protected" class="secondary" type="button">Protected call</button>
        <button id="logout" class="secondary" type="button">Sign out</button>
    </nav>
    <pre id="output" aria-live="polite">Ready.</pre>
</main>
<script>
    const output = document.getElementById("output");

    async function call(path, options = {}) {
        output.textContent = "Loading...";
        try {
            const response = await fetch(path, {credentials: "same-origin", ...options});
            const body = response.status === 204 ? {logged_out: true} : await response.json();
            output.textContent = JSON.stringify({status: response.status, ...body}, null, 2);
        } catch (error) {
            output.textContent = "Request failed.";
        }
    }

    document.getElementById("session").addEventListener("click", () => call("/session"));
    document.getElementById("protected").addEventListener("click", () => call("/api/protected"));
    document.getElementById("logout").addEventListener("click", () => call("/logout", {method: "POST"}));
    call("/session");
</script>
</body>
</html>
